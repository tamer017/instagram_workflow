name: Publish Quran Reels to Instagram

on:
  schedule:
    - cron: '0 * * * *'  # Every hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-reel:
    runs-on: ubuntu-latest
    name: Generate and Publish Quran Reel

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
          # Download Arabic fonts with tashkeel support
          mkdir -p fonts
          wget -q -O /tmp/sch.zip https://software.sil.org/downloads/r/scheherazade/ScheherazadeNew-4.000.zip
          unzip -q /tmp/sch.zip -d /tmp/sch
          cp /tmp/sch/ScheherazadeNew-4.000/ScheherazadeNew-Regular.ttf fonts/
          
          wget -q -O fonts/Amiri-Regular.ttf https://github.com/aliftype/amiri/releases/download/1.000/Amiri-Regular.ttf || true
          
          echo "✅ Arabic fonts installed"

      - name: Get next group
        id: next-group
        run: |
          python3 << 'PYTHON_EOF'
          import json
          import os
          
          # Load reciter 1 groups
          with open('quran_groups/reciter_1_AbdulBaset_AbdulSamad_groups.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
              groups = list(data['groups'].keys())
          
          # Load tracker from separate file
          tracker_file = 'published_groups.json'
          published = []
          if os.path.exists(tracker_file):
              with open(tracker_file, 'r', encoding='utf-8') as f:
                  published = json.load(f).get('published_groups', [])
          
          # Find next unpublished group
          next_group = None
          for group_id in groups:
              if group_id not in published:
                  next_group = group_id
                  break
          
          # If all published, restart
          if not next_group:
              next_group = groups[0]
              published = []  # Reset
          
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"group_id={next_group}\n")
              f.write(f"restart={'true' if len(published) == 0 else 'false'}\n")
              
          print(f"Next: {next_group}")
          PYTHON_EOF

      - name: Generate video
        run: |
          python generate_simple_video.py --group ${{ steps.next-group.outputs.group_id }}
          
          # Verify video was created
          if [ ! -f "generated_videos/${{ steps.next-group.outputs.group_id }}.mp4" ]; then
            echo "❌ Video generation failed"
            exit 1
          fi
          
          # Check file size
          VIDEO_SIZE=$(stat -c%s "generated_videos/${{ steps.next-group.outputs.group_id }}.mp4")
          VIDEO_SIZE_MB=$((VIDEO_SIZE / 1024 / 1024))
          
          echo "📊 Generated video size: ${VIDEO_SIZE_MB}MB"
          
          # If video is too large, re-encode with higher compression
          if [ $VIDEO_SIZE_MB -gt 95 ]; then
            echo "⚠️ Video too large (${VIDEO_SIZE_MB}MB), re-encoding with higher compression..."
            
            ffmpeg -i "generated_videos/${{ steps.next-group.outputs.group_id }}.mp4" \
              -c:v libx264 \
              -preset medium \
              -crf 28 \
              -c:a aac \
              -b:a 128k \
              -movflags +faststart \
              -y "generated_videos/${{ steps.next-group.outputs.group_id }}_compressed.mp4"
            
            # Replace original with compressed
            mv "generated_videos/${{ steps.next-group.outputs.group_id }}_compressed.mp4" \
               "generated_videos/${{ steps.next-group.outputs.group_id }}.mp4"
            
            # Check new size
            NEW_SIZE=$(stat -c%s "generated_videos/${{ steps.next-group.outputs.group_id }}.mp4")
            NEW_SIZE_MB=$((NEW_SIZE / 1024 / 1024))
            echo "✅ Compressed to ${NEW_SIZE_MB}MB"
          fi
          
          ls -lh generated_videos/${{ steps.next-group.outputs.group_id }}.mp4

      - name: Deploy video to GitHub Pages
        run: |
          # Copy video to temp location (outside git workspace)
          TEMP_VIDEO="/tmp/${{ steps.next-group.outputs.group_id }}.mp4"
          cp "generated_videos/${{ steps.next-group.outputs.group_id }}.mp4" "$TEMP_VIDEO"
          
          echo "📁 Copied to: $TEMP_VIDEO"
          ls -lh "$TEMP_VIDEO"
          
          # Configure git
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          
          # Fetch gh-pages branch
          git fetch origin gh-pages || echo "gh-pages doesn't exist yet"
          
          # Switch to gh-pages branch
          git checkout gh-pages || git checkout --orphan gh-pages
          
          # Clean directory but keep .git
          find . -maxdepth 1 ! -name '.git' ! -name '.' ! -name '..' -exec rm -rf {} +
          
          # Create videos directory
          mkdir -p videos
          
          # Copy video from temp
          echo "📋 Copying video to gh-pages..."
          cp "$TEMP_VIDEO" "videos/${{ steps.next-group.outputs.group_id }}.mp4"
          
          ls -lh videos/
          
          # Create simple index.html
          cat > index.html << 'HTML'
          <!DOCTYPE html>
          <html>
          <head><title>Quran Videos</title></head>
          <body><h1>Quran Video Hosting</h1></body>
          </html>
          HTML
          
          # Create .nojekyll to serve files as-is
          touch .nojekyll
          
          # Commit and push
          git add .
          git commit -m "Add video: ${{ steps.next-group.outputs.group_id }}"
          git push origin gh-pages
          
          # Return to main branch
          git checkout main
          
          # Cleanup temp file
          rm -f "$TEMP_VIDEO"

      - name: Wait for GitHub Pages to deploy
        run: |
          echo "Waiting for GitHub Pages deployment..."
          sleep 30

      - name: Post to Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          LONG_LIVED_TOKEN: ${{ secrets.LONG_LIVED_TOKEN }}
          GROUP_ID: ${{ steps.next-group.outputs.group_id }}
        run: |
          python3 << 'PYTHON_EOF'
          import os
          import requests
          import time
          import json
          
          IG_USER_ID = os.environ['IG_USER_ID']
          TOKEN = os.environ['LONG_LIVED_TOKEN']
          GROUP_ID = os.environ['GROUP_ID']
          
          # Load group data to get surah and ayah info
          with open('quran_groups/reciter_1_AbdulBaset_AbdulSamad_groups.json', 'r', encoding='utf-8') as f:
              groups_data = json.load(f)
              group_info = groups_data['groups'][GROUP_ID]
          
          # Load surah names
          with open('surah_names.json', 'r', encoding='utf-8') as f:
              surah_names = json.load(f)['surahs']
          
          # Get surah info
          surah_num = group_info['surah']
          ayah_start = group_info['ayah_start']
          ayah_end = group_info['ayah_end']
          surah_arabic = surah_names[str(surah_num)]['arabic']
          surah_english = surah_names[str(surah_num)]['english']
          
          # Build caption
          if ayah_start == ayah_end:
              ayah_range_ar = f"الآية {ayah_start}"
              ayah_range_en = f"Verse {ayah_start}"
          else:
              ayah_range_ar = f"الآيات {ayah_start}-{ayah_end}"
              ayah_range_en = f"Verses {ayah_start}-{ayah_end}"
          
          surah_hashtag = surah_english.replace('-', '').replace(' ', '')
          
          caption = f"🕌 القرآن الكريم\n"
          caption += f"📖 سورة {surah_arabic} • {ayah_range_ar}\n\n"
          caption += f"🕌 Holy Quran\n"
          caption += f"📖 Surah {surah_english} • {ayah_range_en}\n\n"
          caption += f"🎙️ القارئ: عبد الباسط عبد الصمد\n"
          caption += f"🎙️ Reciter: Abdul Basit Abdul Samad\n\n"
          caption += f"#Quran #QuranRecitation #Islam #القرآن #تلاوة #اسلام #{surah_hashtag}"
          
          # GitHub Pages URL
          VIDEO_URL = f"https://tamer017.github.io/instagram_workflow/videos/{GROUP_ID}.mp4"
          
          print(f"📱 Posting {GROUP_ID}")
          print(f"📖 Surah: {surah_arabic} ({surah_english})")
          print(f"📝 Ayahs: {ayah_start}-{ayah_end}")
          print(f"🔗 Video URL: {VIDEO_URL}")
          
          # Create container
          url = f"https://graph.facebook.com/v21.0/{IG_USER_ID}/media"
          data = {
              'media_type': 'REELS',
              'video_url': VIDEO_URL,
              'caption': caption,
              'access_token': TOKEN
          }
          
          print("⬆️ Creating media container...")
          r = requests.post(url, data=data)
          
          if r.status_code != 200:
              print(f"❌ Container creation failed: {r.text}")
              exit(1)
          
          container_id = r.json()['id']
          print(f"✅ Container created: {container_id}")
          
          # Wait for processing
          print("⏳ Waiting for video processing...")
          max_wait = 180
          waited = 0
          
          while waited < max_wait:
              status_url = f"https://graph.facebook.com/v21.0/{container_id}"
              status_params = {'fields': 'status_code', 'access_token': TOKEN}
              status_r = requests.get(status_url, params=status_params)
              
              if status_r.status_code == 200:
                  status = status_r.json().get('status_code', 'UNKNOWN')
                  print(f"Status: {status} (waited {waited}s)")
                  
                  if status == 'FINISHED':
                      print("✅ Processing complete")
                      break
                  elif status == 'ERROR':
                      print("❌ Processing failed")
                      print(status_r.json())
                      exit(1)
              
              time.sleep(10)
              waited += 10
          
          if waited >= max_wait:
              print("⚠️ Processing timeout, attempting publish anyway...")
          
          # Publish
          print("📤 Publishing to Instagram...")
          pub_url = f"https://graph.facebook.com/v21.0/{IG_USER_ID}/media_publish"
          pub_data = {'creation_id': container_id, 'access_token': TOKEN}
          pub_r = requests.post(pub_url, data=pub_data)
          
          if pub_r.status_code == 200:
              print(f"✅ Published: {pub_r.json()['id']}")
              print(f"📱 Caption preview:")
              print(caption)
          else:
              print(f"❌ Publish failed: {pub_r.text}")
              exit(1)
          PYTHON_EOF

      - name: Update tracker
        run: |
          python3 << 'PYTHON_EOF'
          import json
          import os
          
          tracker_file = 'published_groups.json'
          group_id = os.environ['GROUP_ID']
          restart = os.environ['RESTART'] == 'true'
          
          tracker = {'published_groups': []}
          if os.path.exists(tracker_file) and not restart:
              with open(tracker_file, 'r') as f:
                  tracker = json.load(f)
          
          if 'published_groups' not in tracker:
              tracker['published_groups'] = []
          
          if restart:
              tracker['published_groups'] = [group_id]
          elif group_id not in tracker['published_groups']:
              tracker['published_groups'].append(group_id)
          
          with open(tracker_file, 'w') as f:
              json.dump(tracker, f, indent=2, ensure_ascii=False)
          
          print(f"✅ Tracked {group_id}")
          print(f"📊 Total published: {len(tracker['published_groups'])}")
          PYTHON_EOF
        env:
          GROUP_ID: ${{ steps.next-group.outputs.group_id }}
          RESTART: ${{ steps.next-group.outputs.restart }}

      - name: Commit
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add published_groups.json
          git commit -m "Published: ${{ steps.next-group.outputs.group_id }}" || true
          git push origin main || true
