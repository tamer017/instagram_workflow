name: Generate and Push Quranic Videos

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'  # Every hour

permissions:
  contents: write

jobs:
  generate-videos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Quranic video
        run: |
          python generate_simple_video.py --group reciter1_s001_001-007

      - name: Check if video was generated
        id: check-video
        run: |
          if [ -f "generated_videos/reciter1_s001_001-007.mp4" ]; then
            echo "video_exists=true" >> $GITHUB_OUTPUT
            ls -lh generated_videos/*.mp4
          else
            echo "video_exists=false" >> $GITHUB_OUTPUT
            echo "No video generated"
          fi

      - name: Configure Git
        if: steps.check-video.outputs.video_exists == 'true'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Add and commit videos
        if: steps.check-video.outputs.video_exists == 'true'
        run: |
          git add generated_videos/*.mp4 2>/dev/null || true
          git commit -m "Add generated Quranic videos $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"

      - name: Push to repository
        if: steps.check-video.outputs.video_exists == 'true'
        run: |
          git push origin main || echo "Nothing to push"

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs
          path: generated_videos/
          retention-days: 3
